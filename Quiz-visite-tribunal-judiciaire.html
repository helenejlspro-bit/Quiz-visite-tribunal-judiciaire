<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visite du tribunal judiciaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  --ground:#EEF0F4; --surface:#FFFFFF; --ink:#18203A; --muted:#5A6378;
  --line:#D5D9E3; --robe:#23386E; --robe-soft:#E3E8F4; --brass:#A87B2C;
  --good:#1F7A4D; --good-soft:#E2F2E9; --bad:#B23A30; --bad-soft:#F8E4E1;
  --on-robe:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10141F; --surface:#1A2030; --ink:#E9ECF3; --muted:#9AA3B8;
    --line:#2D3548; --robe:#8EA6E0; --robe-soft:#243150; --brass:#D6AB5C;
    --good:#5BC894; --good-soft:#173527; --bad:#EE7F74; --bad-soft:#3D1F1C;
    --on-robe:#10141F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10141F; --surface:#1A2030; --ink:#E9ECF3; --muted:#9AA3B8;
  --line:#2D3548; --robe:#8EA6E0; --robe-soft:#243150; --brass:#D6AB5C;
  --good:#5BC894; --good-soft:#173527; --bad:#EE7F74; --bad-soft:#3D1F1C;
  --on-robe:#10141F;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:400 17px/1.5 "Source Sans 3",system-ui,sans-serif;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;text-wrap:balance;margin:0;line-height:1.1}
h1{font-weight:800;font-size:clamp(2rem,8vw,2.8rem);letter-spacing:-.02em}
h2{font-weight:600;font-size:1.45rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
p{margin:0}
.muted{color:var(--muted)}
.floors{display:flex;flex-direction:column;border-left:3px solid var(--robe);padding-left:14px;gap:6px}
.floor{display:flex;gap:12px;align-items:baseline}
.floor b{font-family:"Bricolage Grotesque",sans-serif;font-variant-numeric:tabular-nums;min-width:3.2ch;color:var(--robe)}
label.f{font-weight:600;font-size:.95rem}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--robe)}
.btn{font:700 1rem "Source Sans 3",sans-serif;padding:14px 18px;border-radius:10px;border:0;background:var(--robe);color:var(--on-robe);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--robe);border:1.5px solid var(--robe)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s}
.place{display:inline-flex;align-self:flex-start;gap:6px;background:var(--robe-soft);color:var(--robe);font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:999px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;font:600 1.05rem "Source Sans 3",sans-serif;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;background:var(--robe-soft);color:var(--robe)}
.opt:hover:not(:disabled){border-color:var(--robe)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.picked{border-color:var(--robe);background:var(--robe-soft)}
.fb{border-radius:12px;padding:14px 16px;background:var(--surface);border:1.5px solid var(--line)}
.fb strong{display:block;margin-bottom:2px}
.fb.ok strong{color:var(--good)} .fb.ko strong{color:var(--bad)} .fb.info strong{color:var(--brass)}
.score{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:4.5rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--robe)}
.score small{font-size:1.6rem;color:var(--muted)}
.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.recap li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.recap .m{font-weight:700}
.m.y{color:var(--good)} .m.n{color:var(--bad)} .m.o{color:var(--brass)}
.recap em{font-style:normal;color:var(--muted);display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1 1 180px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const Q = [
  {place:"Le bâtiment", q:"Le tribunal judiciaire de Paris se décompose en trois parties. Lesquelles ?",
   o:["Le socle, le Bastion et l'immeuble de grande hauteur (IGH)","Le parvis, le Bastion et l'immeuble de grande hauteur (IGH)","Le socle, l'atrium et la tour"], a:0,
   x:"Le bâtiment se compose du socle, du Bastion et de l'immeuble de grande hauteur (IGH)."},
  {place:"Salle des pas perdus", q:"À quels étages se trouvent les salles d'audience ?",
   o:["2, 3, 4 et 6","2, 4 et 6","2, 4, 6 et 8"], a:1,
   x:"Les salles d'audience sont aux 2e, 4e et 6e étages."},
  {place:"Se repérer", q:"Où se situent les bureaux d'aide juridictionnelle et d'aide aux victimes ?",
   o:["Dans la salle des pas perdus","Au 2e étage","Au 8e étage"], a:0,
   x:"Ils se trouvent dans la salle des pas perdus, facilement accessibles au public."},
  {place:"Salle des pas perdus", q:"Combien d'entrées/sorties réservées aux fonctionnaires sont accessibles vers/depuis la salle des pas perdus ?",
   o:["1","2","3"], a:1, x:"Il y en a 2."},
  {place:"Salle des pas perdus", q:"Vrai ou faux : depuis l'accueil de la salle des pas perdus, on a accès à la cantine.",
   o:["Vrai","Faux"], a:null, x:"Question bonus : votre guide vous donnera la réponse. Elle ne compte pas dans le score."},
  {place:"Question technique", q:"À quelle fréquence faut-il recharger les clés de bureau ?",
   o:["Chaque jour","Une fois par semaine","Une fois par mois"], a:1, x:"Une fois par semaine : pensez-y en début de semaine."},
  {place:"Se repérer", q:"À quel étage se trouve la cantine ?",
   o:["6e étage","8e étage","19e étage"], a:1, x:"La cantine est au 8e étage."},
  {place:"Se repérer", q:"Que trouve-t-on au 19e étage ?",
   o:["Une cafétéria et une bibliothèque","Une cafétéria et une terrasse","Une cantine et une terrasse"], a:1,
   x:"Au 19e, il y a uniquement la cafétéria et une terrasse."},
  {place:"Se repérer", q:"À quel étage se trouve la bibliothèque ?",
   o:["8e étage","19e étage","30e étage"], a:2,
   x:"La bibliothèque se trouve dans l'IGH haut, au 30e étage."},
  {place:"Le Bastion", q:"Par quel étage peut-on accéder au Bastion ?",
   o:["6e étage","8e étage","19e étage"], a:1, x:"Par le 8e, le même étage que la cantine."}
];
const OK=["Bien vu !","Exact !","Bravo !","Parfait !","Dans le mille !","Tout juste !"];
const KO=["Pas tout à fait.","Raté, de peu.","Presque !","Pas cette fois."];
const scored = Q.filter(q=>q.a!==null).length;
let S = {step:"start", team:"", i:0, picks:[]};
const app = document.getElementById("app");
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const score = () => S.picks.reduce((n,p,i)=>n+(Q[i].a!==null&&p===Q[i].a?1:0),0);

function render(){
  if(S.step==="start") return start();
  if(S.step==="q") return question();
  end();
}
function start(){
  app.innerHTML = `
    <p class="eyebrow">Visite du tribunal judiciaire</p>
    <h1>Testez vos connaissances</h1>
    <p class="muted">Vous venez de visiter le bâtiment. Qu'en avez-vous retenu ? ${Q.length} questions pour le vérifier.</p>
    <button class="btn" id="go">Commencer le quiz</button>`;
  document.getElementById("go").onclick=()=>{S.step="q";S.i=0;S.picks=[];render();};
}
function question(){
  const q=Q[S.i], picked=S.picks[S.i], answered=picked!==undefined;
  const keys="ABC";
  let fb="";
  if(answered){
    if(q.a===null) fb=`<div class="fb info" role="status"><strong>Réponse notée.</strong>${q.x}</div>`;
    else if(picked===q.a) fb=`<div class="fb ok" role="status"><strong>${OK[S.i%OK.length]}</strong>${q.x}</div>`;
    else fb=`<div class="fb ko" role="status"><strong>${KO[S.i%KO.length]}</strong>La bonne réponse : ${q.o[q.a]}. ${q.x}</div>`;
  }
  app.innerHTML = `
    <div class="top"><span>Testez vos connaissances</span><span>Question ${S.i+1} / ${Q.length}</span></div>
    <div class="bar"><i style="width:${(S.i+(answered?1:0))/Q.length*100}%"></i></div>
    <span class="place">${q.place}</span>
    <h2>${q.q}</h2>
    <div class="opts">${q.o.map((o,j)=>{
      let c="";
      if(answered){ if(q.a===null){ if(j===picked)c="picked"; } else if(j===q.a)c="right"; else if(j===picked)c="wrong"; }
      return `<button class="opt ${c}" data-j="${j}" ${answered?"disabled":""}><span class="k">${keys[j]}</span>${o}</button>`;
    }).join("")}</div>
    ${fb}
    ${answered?`<button class="btn" id="next">${S.i<Q.length-1?"Question suivante":"Voir le résultat"}</button>`:""}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.picks[S.i]=+b.dataset.j;render();document.getElementById("next")?.focus();});
  const n=document.getElementById("next");
  if(n) n.onclick=()=>{ if(S.i<Q.length-1){S.i++;} else S.step="end"; render(); window.scrollTo(0,0); };
}
function end(){
  const s=score();
  const msg = s===scored?"Sans faute : vous connaissez le bâtiment par cœur.":
              s>=scored-2?"Très beau score, vous ne vous perdrez pas.":
              s>=scored/2?"Pas mal ! Le plan des étages rentrera vite.":"Le bâtiment garde encore quelques secrets pour vous.";
  app.innerHTML = `
    <p class="eyebrow">Votre résultat</p>
    <div class="score">${s}<small> / ${scored}</small></div>
    <p>${msg}</p>
    <p class="muted">Merci d'avoir participé à la visite du tribunal judiciaire.</p>
    <ul class="recap">${Q.map((q,i)=>{
      const p=S.picks[i], bonus=q.a===null, ok=!bonus&&p===q.a;
      return `<li><span class="m ${bonus?"o":ok?"y":"n"}">${bonus?"★":ok?"✓":"✗"}</span>
        <span>${q.q}<em>${bonus?"Bonus · votre réponse : "+q.o[p]:"Réponse : "+q.o[q.a]}</em></span></li>`;
    }).join("")}</ul>
    <div class="row"><button class="btn ghost" id="again">Rejouer</button></div>`;
  document.getElementById("again").onclick=()=>{S={step:"start",team:S.team,i:0,picks:[]};render();};
}
render();
</script>
</body>
</html>
